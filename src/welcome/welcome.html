<!doctype html>
<html lang="en" data-drip-shown>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Welcome to drip</title>
    <link rel="stylesheet" href="../pages.css" />
    <!-- The tour's small screens are drawn with drip's own YouTube styles. -->
    <link rel="stylesheet" href="../content/drip.css" />
    <link rel="stylesheet" href="welcome.css" />
    <link rel="stylesheet" href="coach.css" />
  </head>
  <body>
    <main>
      <header class="hero">
        <h1 class="brand"><span class="brand-drop" id="brandDrop"></span>drip</h1>
        <p class="tagline">Make every drop count.</p>
      </header>

      <!-- Two screens (DESIGN.md "Welcome page"): the mode choice, then the tour for the mix picked. One shows at a time. -->
      <!-- The mode (Q29, DESIGN.md "Modes"), design J: Full drip picked to start and recommended. -->
      <section class="modes screen" id="choose" aria-labelledby="modesAsk">
        <h2 class="modes-ask" id="modesAsk">How much should drip do?</h2>
        <p class="modes-sub">You can change this in Settings. For your first 24 hours, changes apply right away.</p>
        <div class="ladder" id="ladder" role="radiogroup" aria-labelledby="modesAsk"></div>
        <div class="modes-after"><button class="tour-btn is-primary" id="modesNext" type="button"></button></div>
      </section>

      <section class="tour screen" id="tour" aria-labelledby="tourTitle" hidden>
        <div class="tour-head">
          <h2 class="tour-title" id="tourTitle" tabindex="-1">How Full drip works</h2>
          <button class="linkish" id="changeMode" type="button">Change</button>
        </div>
        <p class="tour-say" id="say" aria-live="polite"></p>
        <div class="tour-stage" id="stage"></div>
        <div class="tour-controls">
          <div class="tour-dots" id="dots"></div>
          <div class="tour-buttons">
            <button class="tour-btn" id="back" type="button">Back</button>
            <button class="tour-btn" id="skip" type="button">Skip</button>
            <button class="tour-btn is-primary" id="next" type="button"></button>
          </div>
        </div>
      </section>

      <footer class="foot">
        <p class="foot-note">Refresh any YouTube tabs that were open before you installed drip.</p>
        <div class="foot-links">
          <a class="foot-link" id="footYouTube" href="https://www.youtube.com/"></a>
          <button class="foot-link" id="footSettings" type="button"></button>
        </div>
        <p class="foot-note">Everything drip knows stays in this browser.</p>
      </footer>
    </main>
    <script src="../lib/state.js"></script>
    <script src="../lib/glass.js"></script>
    <script src="../content/common.js"></script>
    <script src="../content/reveal.js"></script>
    <script src="../content/pour.js"></script>
    <script src="../content/counter.js"></script>
    <script src="../content/stash.js"></script>
    <script src="coach.js"></script>
    <script src="welcome.js"></script>
  </body>
</html>
