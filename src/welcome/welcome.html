<!doctype html>
<html lang="en" data-drip-shown>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Welcome to drip</title>
    <link rel="stylesheet" href="../pages.css" />
    <!-- The tour's small screens are drawn with drip's own YouTube styles. -->
    <link rel="stylesheet" href="../content/drip.css" />
    <link rel="stylesheet" href="welcome.css" />
  </head>
  <body>
    <main>
      <header class="hero">
        <h1 class="brand"><span class="brand-drop" id="brandDrop"></span>drip</h1>
        <p class="tagline">Make every drop count.</p>
        <ul class="kinds" id="kinds"></ul>
        <p class="allowance" id="allowance">You get 4 drops and 10 cards a day. You can change these in Settings.</p>
      </header>

      <section class="tour" id="tour" aria-label="How drip works">
        <p class="tour-say" id="say" aria-live="polite"></p>
        <div class="tour-stage" id="stage"></div>
        <div class="tour-controls">
          <div class="tour-dots" id="dots"></div>
          <div class="tour-buttons">
            <button class="tour-btn" id="back" type="button">Back</button>
            <button class="tour-btn" id="skip" type="button">Skip</button>
            <button class="tour-btn is-primary" id="next" type="button"></button>
          </div>
        </div>
      </section>

      <footer class="foot">
        <div class="foot-links">
          <a class="foot-link" id="footYouTube" href="https://www.youtube.com/"></a>
          <button class="foot-link" id="footSettings" type="button"></button>
        </div>
        <p class="foot-note">Everything drip knows stays in this browser.</p>
      </footer>
    </main>
    <script src="../lib/state.js"></script>
    <script src="../lib/glass.js"></script>
    <script src="../content/common.js"></script>
    <script src="../content/reveal.js"></script>
    <script src="welcome.js"></script>
  </body>
</html>
