<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>drip settings</title>
    <link rel="stylesheet" href="../pages.css" />
    <link rel="stylesheet" href="options.css" />
  </head>
  <body class="settings">
    <main>
      <h1>drip settings</h1>
      <p class="sample-note" id="sampleNote" hidden>
        Sample data: <strong id="sampleName"></strong>. Nothing on this page is saved.
        <button class="link" id="sampleBack" type="button">Show my data</button>
      </p>

      <p class="muted first-day" id="firstDay" hidden></p>
      <form id="settings" novalidate></form>
      <div class="save-row">
        <button class="primary" id="save" type="button">Save</button>
        <span class="muted" id="result" role="status"></span>
      </div>

      <h1 class="watch-title">Watch time</h1>
      <h2 class="caps">History</h2>
      <div class="card" id="history"></div>

      <section id="reasons-section" hidden>
        <h2 class="caps">Why you needed one</h2>
        <ul class="reasons" id="reasons"></ul>
      </section>

      <!-- Shown only in a build that has the dev panel, so never in the store build. -->
      <section id="dev" hidden>
        <h2 class="caps">Developer mode</h2>
        <label class="dev-row">
          <input type="checkbox" id="devMode" />
          <span>Show the dev panel on YouTube pages</span>
        </label>
        <div class="dev-row sample-row" id="sampleRow" hidden>
          <label for="sample">Show Settings with</label>
          <div class="picker-wrap"><select class="picker" id="sample"></select></div>
        </div>
        <p class="muted" id="devHint">
          For testing. The panel sets minutes and tokens and runs the daily reset now, so it undoes every limit while
          it's on. Turn it off when you're done.
        </p>
      </section>
    </main>
    <script src="../lib/state.js"></script>
    <script src="../pages.js"></script>
    <script src="options.js"></script>
  </body>
</html>
