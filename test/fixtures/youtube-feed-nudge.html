<!-- Logged-out youtube.com home, captured 2026-11-05. Style classes trimmed; section wrapper restored. -->
<ytd-rich-grid-renderer>
  <ytd-rich-section-renderer>
    <ytd-feed-nudge-renderer>
      <div id="dismissible">
        <div id="dismiss-button"></div>
        <div id="content-wrapper">
          <div id="header-container">
            <div id="image-container" hidden="">
              <yt-img-shadow id="nudge-image">
                <img id="img" alt="">
              </yt-img-shadow>
            </div>
          </div>
          <div id="text-container">
            <h2 id="title-container">
              <yt-formatted-string id="title">Try searching to get started</yt-formatted-string>
            </h2>
            <div id="subtitle-container">
              <yt-formatted-string id="subtitle">Start watching videos to help us build a feed of videos you'll love.</yt-formatted-string>
            </div>
          </div>
          <div id="contents" hidden=""></div>
          <div id="button-container" hidden="">
            <div id="primary-button"></div>
            <div id="secondary-button"></div>
          </div>
        </div>
      </div>
      <div id="dismissed">
        <div id="dismissed-content"></div>
      </div>
    </ytd-feed-nudge-renderer>
  </ytd-rich-section-renderer>
</ytd-rich-grid-renderer>
