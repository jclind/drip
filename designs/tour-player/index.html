<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>drip tour player, round 1</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap">
<style>
  :root { --bg: #0f0f0f; --bar: #1c1c1c; --text: #f1f1f1; --muted: #aaa; --chip: rgba(255,255,255,.1); --on: #fff; --on-fg: #0f0f0f; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { display: flex; flex-direction: column; font: 13px/1.4 Roboto, Arial, sans-serif; color: var(--text); background: var(--bg); }
  .bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; padding: 10px 16px; background: var(--bar); }
  .round { color: var(--muted); }
  .group { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; }
  #round1 .round { margin-right: 4px; }
  .bar button, .bar a { height: 30px; padding: 0 12px; border: 0; border-radius: 15px; background: var(--chip); color: var(--text); font: inherit; font-weight: 500; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; }
  .bar button[aria-pressed="true"] { background: var(--on); color: var(--on-fg); }
  .bar button:disabled { opacity: .4; cursor: default; }
  .idea { flex-basis: 100%; color: var(--muted); max-width: 900px; }
  .view { flex: 1; display: flex; justify-content: center; min-height: 0; }
  iframe { flex: 1; width: 100%; height: 100%; border: 0; background: var(--bg); }
  .view.is-phone iframe { flex: 0 0 390px; max-width: 100%; outline: 1px solid #333; }
  :focus-visible { outline: 2px solid #3ea6ff; outline-offset: 2px; }
</style>
</head>
<body>
<div class="bar">
  <span class="round">Round 1</span>
  <div class="group">
    <button type="button" data-v="a">A, Sinking boat</button>
    <button type="button" data-v="b">B, Drops leave the glass</button>
    <button type="button" data-v="c">C, The video you picked</button>
  </div>
  <div class="group">
    <span class="round">Video</span>
    <button type="button" data-video="tour-joinery">Joinery</button>
    <button type="button" data-video="tour-trail">Trail</button>
    <button type="button" data-video="tour-bread">Sourdough</button>
    <button type="button" data-video="tour-orbit">Moon</button>
    <button type="button" data-video="tour-redstone">Redstone</button>
  </div>
  <div class="group">
    <button type="button" data-t="dark">Dark</button>
    <button type="button" data-t="light">Light</button>
  </div>
  <div class="group">
    <button type="button" data-w="wide">Desktop</button>
    <button type="button" data-w="phone">Phone</button>
  </div>
  <button type="button" id="restart">Back to the player</button>
  <button type="button" id="whole">Whole tour</button>
  <a id="open" target="_blank" rel="noopener">Open alone</a>
  <div class="idea" id="idea"></div>
</div>
<div class="view" id="view"><iframe id="frame" title="Welcome tour"></iframe></div>
<script>
  // Every variant runs the real tour from src/welcome, opened on the player step. Press play in the frame. When the
  // minutes run out the tour moves to the lock on its own. The video buttons pick which card's video plays, as if it
  // had been watched in step 2; "Whole tour" starts from step 1, where the card you watch picks it.
  const IDEAS = {
    a: 'A, Sinking boat: the video is a small sea at dusk. The sea creeps up and the sun sinks as your minutes drain, and the boat starts to list. At 0 it goes down, and the lock's water rises over the empty sea. The same scene for every video.',
    b: 'B, Drops leave the glass: each minute you watch falls out of the pill\'s glass as a drop and lands at the bottom of the player. The drops pool there, so the lock\'s water rises out of a pool you watched fill.',
    c: 'C, The video you picked: a short loop for the card you watched (the Moon turning one face to Earth, the loaf rising, the redstone clock ticking, the joint sliding shut, the ride along the ridge), tagged "90× speed", with a running timecode.',
  };
  const st = { v: 'a', video: 'tour-orbit', t: 'dark', w: 'wide', whole: false };
  try { Object.assign(st, JSON.parse(sessionStorage.getItem('tour-player-1') || '{}')); } catch {}
  function url(fresh) {
    const p = new URLSearchParams({ v: st.v });
    if (!st.whole) p.set('video', st.video);
    if (fresh) p.set('n', String(Date.now()));
    return `tour.html?${p}#tour-${st.whole ? 1 : 3}`;
  }
  function go(force) {
    const u = url(force);
    const f = document.getElementById('frame');
    f.style.colorScheme = st.t;
    if (f.getAttribute('src') !== u) f.src = u;
    document.getElementById('open').href = u;
    document.getElementById('idea').textContent = IDEAS[st.v];
    document.getElementById('view').classList.toggle('is-phone', st.w === 'phone');
    for (const b of document.querySelectorAll('[data-v]')) b.setAttribute('aria-pressed', String(b.dataset.v === st.v));
    for (const b of document.querySelectorAll('[data-video]')) b.setAttribute('aria-pressed', String(!st.whole && b.dataset.video === st.video));
    for (const b of document.querySelectorAll('[data-t]')) b.setAttribute('aria-pressed', String(b.dataset.t === st.t));
    for (const b of document.querySelectorAll('[data-w]')) b.setAttribute('aria-pressed', String(b.dataset.w === st.w));
    try { sessionStorage.setItem('tour-player-1', JSON.stringify(st)); } catch {}
  }
  for (const b of document.querySelectorAll('[data-v],[data-video],[data-t],[data-w]')) b.addEventListener('click', () => {
    for (const k of ['v', 'video', 't', 'w']) if (b.dataset[k]) st[k] = b.dataset[k];
    if (b.dataset.video) st.whole = false;
    go(true);
  });
  document.getElementById('restart').addEventListener('click', () => { st.whole = false; go(true); });
  document.getElementById('whole').addEventListener('click', () => { st.whole = true; go(true); });
  go();
</script>
</body>
</html>
