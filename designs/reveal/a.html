<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reveal: A, Surface</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap">
<link rel="stylesheet" href="base.css">
<link rel="stylesheet" href="drip.css">
<link rel="stylesheet" href="water.css">
</head>
<body>
<script src="glass.js"></script>
<script src="base.js"></script>
<script src="water.js"></script>
<script>
// A, Surface. Nothing on the page moves except inside the card's own box. The box is still water: a drop falls into
// it, rings spread while the video loads, and the thumbnail opens out from the center as the last ring goes. Going
// back down (Reveal next, Pass) closes the picture to a point, the way a stone sinks.
const { app, animate, wait, REDUCED } = Mock;
let current = null;

/** Swaps in the card for `video` with its text held back, keeping the water layer, then opens the picture out. */
async function surface(api, video, fx, drop, rowShown) {
  const card = api.card(video);
  card.thumb.append(fx);
  card.thumb.classList.add('w-pool');
  const held = [card.title, card.metaRow, ...(rowShown ? [] : [card.row])];
  held.forEach((el) => el.classList.add('w-hold'));
  for (const b of card.row.querySelectorAll('button')) b.disabled = true;
  api.slot.replaceChildren(card.el);
  current = card;
  await Promise.all([drop.landed, api.loadThumb(card.img, video)]);
  drop.stop();
  const opened = Water.open(card.thumb, card.img);
  held.forEach((el) => el.classList.remove('w-hold'));
  Water.textIn(held);
  await opened;
  for (const b of card.row.querySelectorAll('button')) b.disabled = false;
}

async function sink(card) {
  for (const b of card.row.querySelectorAll('button')) b.disabled = true;
  Water.fadeOut([card.title, card.metaRow]);
  return Water.sink(card.thumb, card.img);
}

app({
  async reveal(api) {
    const shell = api.shell();
    const fx = Water.layer(shell.thumb);
    api.slot.replaceChildren(shell.el);
    api.setMode('card');
    const drop = Water.dropIn(fx);
    await surface(api, await api.feed(), fx, drop, false);
  },
  async next(api) {
    current.next.querySelector('.drip-next-label').textContent = 'Revealing…';
    const fx = await sink(current);
    const drop = Water.dropIn(fx);
    await surface(api, await api.feed(), fx, drop, true);
  },
  async pass(api) {
    await sink(current);
    await Water.fadeOut([current.row], 160);
    // The card's space closes up to the buttons' height, and the buttons come back.
    const from = api.slot.offsetHeight;
    const actions = api.actions();
    api.slot.replaceChildren(actions);
    const to = api.slot.offsetHeight;
    api.slot.style.overflow = 'hidden';
    animate(actions, [{ opacity: 0 }, { opacity: 1 }], { duration: 240, delay: 180 });
    await animate(api.slot, [{ height: `${from}px` }, { height: `${to}px` }], { duration: 380, easing: 'cubic-bezier(0.4, 0, 0.2, 1)' });
    api.slot.getAnimations().forEach((a) => a.cancel());
    api.slot.style.overflow = '';
    api.setMode('empty');
    current = null;
  },
});
</script>
</body>
</html>
