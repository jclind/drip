<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reveal: as built</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap">
<link rel="stylesheet" href="base.css">
<link rel="stylesheet" href="drip.css">
</head>
<body>
<script src="glass.js"></script>
<script src="base.js"></script>
<script>
// As built (home.js): the shell shimmers while the feed is read, the card rises 6px over 260ms, and the thumbnail
// fades in when it loads. Reveal next dims the old card. Pass swaps the buttons back at once.
const { app } = Mock;
let current = null;

function showCard(api, video) {
  current = api.card(video);
  current.el.classList.add('is-new');
  api.slot.replaceChildren(current.el);
  api.loadThumb(current.img, video).then(() => current.img.classList.add('is-loaded'));
}

app({
  async reveal(api) {
    api.slot.replaceChildren(api.shell().el);
    api.setMode('card');
    showCard(api, await api.feed());
  },
  async next(api) {
    current.el.classList.add('is-next');
    current.el.querySelector('.drip-next-label').textContent = 'Revealing…';
    current.el.querySelector('.drip-next .drip-price').remove();
    for (const b of current.el.querySelectorAll('button')) b.disabled = true;
    showCard(api, await api.feed());
  },
  async pass(api) {
    api.slot.replaceChildren(api.actions());
    api.setMode('empty');
  },
});
</script>
</body>
</html>
