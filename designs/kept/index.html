<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kept variants</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap">
<style>
:root {
  --bg: #0f0f0f;
  --bar: #181818;
  --text: #f1f1f1;
  --muted: #aaa;
  --line: rgba(255, 255, 255, 0.12);
  --on: #42a5f6;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  height: 100vh;
  display: flex;
  flex-direction: column;
  font: 14px/1.4 "Roboto", "Arial", sans-serif;
  color: var(--text);
  background: var(--bg);
}

header {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px 16px;
  padding: 10px 16px;
  background: var(--bar);
  border-bottom: 1px solid var(--line);
}

.round {
  color: var(--muted);
  font-size: 13px;
}

nav, .opts {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}

button {
  font: inherit;
  font-weight: 500;
  padding: 6px 12px;
  border: 1px solid var(--line);
  border-radius: 16px;
  color: var(--text);
  background: none;
  cursor: pointer;
}

button[aria-pressed="true"] {
  border-color: var(--on);
  background: rgba(66, 165, 246, 0.16);
}

button:focus-visible {
  outline: 2px solid var(--on);
  outline-offset: 2px;
}

.opts {
  margin-left: auto;
}

.idea {
  width: 100%;
  color: var(--muted);
  font-size: 13px;
}

.idea a {
  color: var(--muted);
}

main {
  flex: 1;
  display: flex;
  justify-content: center;
  min-height: 0;
  background: #000;
}

iframe {
  width: 100%;
  height: 100%;
  border: 0;
  background: #0f0f0f;
}

main.is-phone iframe {
  width: 390px;
  border-left: 1px solid var(--line);
  border-right: 1px solid var(--line);
}
</style>
</head>
<body>
<header>
  <span class="round">Kept drops · round 1</span>
  <nav id="scenes"></nav>
  <nav id="tabs"></nav>
  <div class="opts">
    <button id="replay" type="button">Replay</button>
    <button id="slow" type="button" aria-pressed="false">Slow ×4</button>
    <button id="light" type="button" aria-pressed="false">Light</button>
    <button id="phone" type="button" aria-pressed="false">Phone</button>
  </div>
  <div class="idea" id="idea"></div>
</header>
<main id="stage"><iframe id="frame" title="Variant"></iframe></main>
<script>
const VARIANTS = [
  { key: 'a', label: 'A, Tag', idea: 'Beside the counter. A small blue tag, "3 kept", slides out of the drop counter as the water leaves, sits there for about 3.5 seconds, and slides back in.' },
  { key: 'b', label: 'B, Note above', idea: 'Above the stats. "Kept 3 drops." and "Unspent drops carry over to tomorrow." float up with a short wave drawn under them, the lock\'s crest left behind, and lift away after about 4 seconds.' },
  { key: 'c', label: 'C, Big count', idea: 'In place of the stats. The stats step back and a large "3, drops kept" takes their spot for about 2 seconds, then the 3 shrinks into the drop counter and the stats come back.' },
  { key: 'now', label: 'As built', idea: 'Today: the gray "Kept 3 drops." rises in under the buttons and stays.' },
];
const SCENES = [
  { key: 'kept', label: 'Done for now' },
];
const params = new URLSearchParams(location.search);
let current = params.get('v') || 'a';
let scene = ['kept', 'new', 'spend'].includes(params.get('scene')) ? params.get('scene') : 'kept';
const flags = { slow: params.get('slow') === '1', light: params.get('light') === '1', phone: params.get('phone') === '1' };
const tabs = document.getElementById('tabs');
const frame = document.getElementById('frame');

function src() {
  const q = new URLSearchParams();
  if (flags.slow) q.set('slow', '4');
  if (flags.light) q.set('theme', 'light');
  q.set('scene', scene);
  q.set('t', Date.now());
  return `${current}.html?${q}`;
}

function render() {
  tabs.replaceChildren(...VARIANTS.map((v) => {
    const b = document.createElement('button');
    b.type = 'button';
    b.textContent = v.label;
    b.setAttribute('aria-pressed', String(v.key === current));
    b.onclick = () => { current = v.key; render(); };
    return b;
  }));
  document.getElementById('scenes').replaceChildren(...SCENES.map((x) => {
    const b = document.createElement('button');
    b.type = 'button';
    b.textContent = x.label;
    b.setAttribute('aria-pressed', String(x.key === scene));
    b.onclick = () => { scene = x.key; render(); };
    return b;
  }));
  const v = VARIANTS.find((x) => x.key === current);
  const idea = document.getElementById('idea');
  idea.textContent = `${v.idea} `;
  const open = document.createElement('a');
  open.href = `${current}.html?scene=${scene}`;
  open.target = '_blank';
  open.textContent = 'Open alone';
  idea.append(open, ' · ');
  const prev = document.createElement('a');
  prev.href = '/counter/?v=a&scene=kept';
  prev.target = '_blank';
  prev.textContent = 'Counter round 1 (on hold)';
  idea.append(prev);
  for (const k of Object.keys(flags)) document.getElementById(k).setAttribute('aria-pressed', String(flags[k]));
  document.getElementById('stage').classList.toggle('is-phone', flags.phone);
  const q = new URLSearchParams({ v: current, scene });
  for (const k of Object.keys(flags)) if (flags[k]) q.set(k, '1');
  history.replaceState(null, '', `?${q}`);
  frame.src = src();
}

for (const k of Object.keys(flags)) document.getElementById(k).onclick = () => { flags[k] = !flags[k]; render(); };
document.getElementById('replay').onclick = () => { frame.src = src(); };
render();
</script>
</body>
</html>
