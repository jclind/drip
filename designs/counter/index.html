<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Counter variants</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap">
<style>
:root {
  --bg: #0f0f0f;
  --bar: #181818;
  --text: #f1f1f1;
  --muted: #aaa;
  --line: rgba(255, 255, 255, 0.12);
  --on: #42a5f6;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  height: 100vh;
  display: flex;
  flex-direction: column;
  font: 14px/1.4 "Roboto", "Arial", sans-serif;
  color: var(--text);
  background: var(--bg);
}

header {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px 16px;
  padding: 10px 16px;
  background: var(--bar);
  border-bottom: 1px solid var(--line);
}

.round {
  color: var(--muted);
  font-size: 13px;
}

nav, .opts {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}

button {
  font: inherit;
  font-weight: 500;
  padding: 6px 12px;
  border: 1px solid var(--line);
  border-radius: 16px;
  color: var(--text);
  background: none;
  cursor: pointer;
}

button[aria-pressed="true"] {
  border-color: var(--on);
  background: rgba(66, 165, 246, 0.16);
}

button:focus-visible {
  outline: 2px solid var(--on);
  outline-offset: 2px;
}

.opts {
  margin-left: auto;
}

.idea {
  width: 100%;
  color: var(--muted);
  font-size: 13px;
}

.idea a {
  color: var(--muted);
}

main {
  flex: 1;
  display: flex;
  justify-content: center;
  min-height: 0;
  background: #000;
}

iframe {
  width: 100%;
  height: 100%;
  border: 0;
  background: #0f0f0f;
}

main.is-phone iframe {
  width: 390px;
  border-left: 1px solid var(--line);
  border-right: 1px solid var(--line);
}
</style>
</head>
<body>
<header>
  <span class="round">Counter · round 2</span>
  <nav id="scenes"></nav>
  <nav id="tabs"></nav>
  <div class="opts">
    <button id="replay" type="button">Replay</button>
    <button id="slow" type="button" aria-pressed="false">Slow ×4</button>
    <button id="light" type="button" aria-pressed="false">Light</button>
    <button id="phone" type="button" aria-pressed="false">Phone</button>
  </div>
  <div class="idea" id="idea"></div>
</header>
<main id="stage"><iframe id="frame" title="Variant"></iframe></main>
<script>
const VARIANTS = [
  { key: 'd', label: 'D, Rain and tag', idea: 'Round 1\'s A with the gray tag. Drops fall from the top of the window into the counter, one at a time, and the count rolls like an odometer. Then the tag slides out ("3 kept", or "4 new" and "10 new" on a new day), stays 3 seconds, and slides back in.' },
  { key: 'e', label: 'E, Left behind and tag', idea: 'Round 1\'s B with the gray tag. Beads stay where the tag will be as the lock\'s water falls past, run into the counter, and the count drips up. Then the tag slides out from the spot they left. On a new day the beads gather like dew.' },
  { key: 'f', label: 'F, Handed over', idea: 'Round 1\'s C with the gray tag. The tag comes out first, and its drops hop out of it into the counter one at a time, the count spinning up. Then the tag stays a moment and slides back in.' },
  { key: 'a', label: 'A (round 1)', idea: 'Round 1. Rain into the counter, with the gray "Kept 3 drops." line under the buttons.' },
  { key: 'b', label: 'B (round 1)', idea: 'Round 1. Beads left behind by the water run into the counter, with the gray line.' },
  { key: 'c', label: 'C (round 1)', idea: 'Round 1. Drops arc out of the message line into the counter.' },
  { key: 'now', label: 'As built', idea: 'Today: "Kept 3 drops." rises in under the buttons, and every count changes at once.' },
];
const SCENES = [
  { key: 'kept', label: 'Done for now: kept drops' },
  { key: 'new', label: 'A new day' },
  { key: 'spend', label: 'Spend: +15m, Reveal' },
];
const params = new URLSearchParams(location.search);
let current = params.get('v') || 'd';
let scene = ['kept', 'new', 'spend'].includes(params.get('scene')) ? params.get('scene') : 'kept';
const flags = { slow: params.get('slow') === '1', light: params.get('light') === '1', phone: params.get('phone') === '1' };
const tabs = document.getElementById('tabs');
const frame = document.getElementById('frame');

function src() {
  const q = new URLSearchParams();
  if (flags.slow) q.set('slow', '4');
  if (flags.light) q.set('theme', 'light');
  q.set('scene', scene);
  q.set('t', Date.now());
  return `${current}.html?${q}`;
}

function render() {
  tabs.replaceChildren(...VARIANTS.map((v) => {
    const b = document.createElement('button');
    b.type = 'button';
    b.textContent = v.label;
    b.setAttribute('aria-pressed', String(v.key === current));
    b.onclick = () => { current = v.key; render(); };
    return b;
  }));
  document.getElementById('scenes').replaceChildren(...SCENES.map((x) => {
    const b = document.createElement('button');
    b.type = 'button';
    b.textContent = x.label;
    b.setAttribute('aria-pressed', String(x.key === scene));
    b.onclick = () => { scene = x.key; render(); };
    return b;
  }));
  const v = VARIANTS.find((x) => x.key === current);
  const idea = document.getElementById('idea');
  idea.textContent = `${v.idea} `;
  const open = document.createElement('a');
  open.href = `${current}.html?scene=${scene}`;
  open.target = '_blank';
  open.textContent = 'Open alone';
  idea.append(open, ' · ');
  const prev = document.createElement('a');
  prev.href = '/kept/d.html';
  prev.target = '_blank';
  prev.textContent = 'Kept round 2 pick, D';
  idea.append(prev);
  for (const k of Object.keys(flags)) document.getElementById(k).setAttribute('aria-pressed', String(flags[k]));
  document.getElementById('stage').classList.toggle('is-phone', flags.phone);
  const q = new URLSearchParams({ v: current, scene });
  for (const k of Object.keys(flags)) if (flags[k]) q.set(k, '1');
  history.replaceState(null, '', `?${q}`);
  frame.src = src();
}

for (const k of Object.keys(flags)) document.getElementById(k).onclick = () => { flags[k] = !flags[k]; render(); };
document.getElementById('replay').onclick = () => { frame.src = src(); };
render();
</script>
</body>
</html>
