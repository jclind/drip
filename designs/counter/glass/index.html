<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Glass variants</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap">
<style>
:root {
  --bg: #0f0f0f;
  --bar: #181818;
  --text: #f1f1f1;
  --muted: #aaa;
  --line: rgba(255, 255, 255, 0.12);
  --on: #42a5f6;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  height: 100vh;
  display: flex;
  flex-direction: column;
  font: 14px/1.4 "Roboto", "Arial", sans-serif;
  color: var(--text);
  background: var(--bg);
}

header {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px 16px;
  padding: 10px 16px;
  background: var(--bar);
  border-bottom: 1px solid var(--line);
}

.round {
  color: var(--muted);
  font-size: 13px;
}

nav, .opts {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}

button {
  font: inherit;
  font-weight: 500;
  padding: 6px 12px;
  border: 1px solid var(--line);
  border-radius: 16px;
  color: var(--text);
  background: none;
  cursor: pointer;
}

button[aria-pressed="true"] {
  border-color: var(--on);
  background: rgba(66, 165, 246, 0.16);
}

button:focus-visible {
  outline: 2px solid var(--on);
  outline-offset: 2px;
}

.opts {
  margin-left: auto;
}

.idea {
  width: 100%;
  color: var(--muted);
  font-size: 13px;
}

.idea a {
  color: var(--muted);
}

main {
  flex: 1;
  display: flex;
  justify-content: center;
  min-height: 0;
  background: #000;
}

iframe {
  width: 100%;
  height: 100%;
  border: 0;
  background: #0f0f0f;
}

main.is-phone iframe {
  width: 390px;
  border-left: 1px solid var(--line);
  border-right: 1px solid var(--line);
}
</style>
</head>
<body>
<header>
  <span class="round">Glass · round 1</span>
  <nav id="scenes"></nav>
  <nav id="tabs"></nav>
  <div class="opts">
    <button id="replay" type="button">Replay</button>
    <button id="slow" type="button" aria-pressed="false">Slow ×4</button>
    <button id="light" type="button" aria-pressed="false">Light</button>
    <button id="phone" type="button" aria-pressed="false">Phone</button>
  </div>
  <div class="idea" id="idea"></div>
</header>
<main id="stage"><iframe id="frame" title="Variant"></iframe></main>
<script>
const VARIANTS = [
  { key: 'a', label: 'A, Pour', idea: 'Water moves as a stream. +15m: a drop leaves the counter, tips over the glass, and pours in, and the water sloshes once. At 0: the pill\'s last water trickles down the window and the lock pools up from where it lands. +15m on the lock: the water drains and a short stream refills the pill.' },
  { key: 'b', label: 'B, Drop', idea: 'Water moves one drop at a time and lands with a ring. +15m: a drop falls into the glass, a ring spreads, and the water bobs up. At 0: the pill\'s last water falls as one drop, splashes at the bottom, and the lock rises from there. +15m on the lock: the button\'s drop falls in, the water drains, and the pill\'s glass bobs up.' },
  { key: 'c', label: 'C, Slosh', idea: 'Nothing flies; the glass and water have weight. +15m: the glass dips like it was set down, the water surges past its level and sloshes twice, and a few bubbles rise. At 0: the pill\'s glass tips over and the lock comes in as a sloped wave from that corner. +15m on the lock: it drains toward the pill first, and the glass rights itself and fills.' },
  { key: 'now', label: 'As built', idea: 'Today: +15m glides the level up over 0.7s. At 0 the lock\'s water rises flat from the bottom. +15m on the lock drains it and the pill\'s level glides.' },
];
const SCENES = [
  { key: 'home', label: 'Home: +15m' },
  { key: 'watch', label: 'Watch: hit 0, then +15m on the lock' },
];
const params = new URLSearchParams(location.search);
let current = params.get('v') || 'a';
let scene = params.get('scene') === 'watch' ? 'watch' : 'home';
const flags = { slow: params.get('slow') === '1', light: params.get('light') === '1', phone: params.get('phone') === '1' };
const tabs = document.getElementById('tabs');
const frame = document.getElementById('frame');

function src() {
  const q = new URLSearchParams();
  if (flags.slow) q.set('slow', '4');
  if (flags.light) q.set('theme', 'light');
  q.set('scene', scene);
  q.set('t', Date.now());
  return `${current}.html?${q}`;
}

function render() {
  tabs.replaceChildren(...VARIANTS.map((v) => {
    const b = document.createElement('button');
    b.type = 'button';
    b.textContent = v.label;
    b.setAttribute('aria-pressed', String(v.key === current));
    b.onclick = () => { current = v.key; render(); };
    return b;
  }));
  document.getElementById('scenes').replaceChildren(...SCENES.map((x) => {
    const b = document.createElement('button');
    b.type = 'button';
    b.textContent = x.label;
    b.setAttribute('aria-pressed', String(x.key === scene));
    b.onclick = () => { scene = x.key; render(); };
    return b;
  }));
  const v = VARIANTS.find((x) => x.key === current);
  const idea = document.getElementById('idea');
  idea.textContent = `${v.idea} `;
  const open = document.createElement('a');
  open.href = `${current}.html?scene=${scene}`;
  open.target = '_blank';
  open.textContent = 'Open alone';
  idea.append(open);
  for (const k of Object.keys(flags)) document.getElementById(k).setAttribute('aria-pressed', String(flags[k]));
  document.getElementById('stage').classList.toggle('is-phone', flags.phone);
  const q = new URLSearchParams({ v: current, scene });
  for (const k of Object.keys(flags)) if (flags[k]) q.set(k, '1');
  history.replaceState(null, '', `?${q}`);
  frame.src = src();
}

for (const k of Object.keys(flags)) document.getElementById(k).onclick = () => { flags[k] = !flags[k]; render(); };
document.getElementById('replay').onclick = () => { frame.src = src(); };
render();
</script>
</body>
</html>
