<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Save variants</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap">
<style>
:root {
  --bg: #0f0f0f;
  --bar: #181818;
  --text: #f1f1f1;
  --muted: #aaa;
  --line: rgba(255, 255, 255, 0.12);
  --on: #42a5f6;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  height: 100vh;
  display: flex;
  flex-direction: column;
  font: 14px/1.4 "Roboto", "Arial", sans-serif;
  color: var(--text);
  background: var(--bg);
}

header {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px 16px;
  padding: 10px 16px;
  background: var(--bar);
  border-bottom: 1px solid var(--line);
}

.round {
  color: var(--muted);
  font-size: 13px;
}

nav, .opts {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}

button {
  font: inherit;
  font-weight: 500;
  padding: 6px 12px;
  border: 1px solid var(--line);
  border-radius: 16px;
  color: var(--text);
  background: none;
  cursor: pointer;
}

button[aria-pressed="true"] {
  border-color: var(--on);
  background: rgba(66, 165, 246, 0.16);
}

button:focus-visible {
  outline: 2px solid var(--on);
  outline-offset: 2px;
}

.opts {
  margin-left: auto;
}

.idea {
  width: 100%;
  color: var(--muted);
  font-size: 13px;
}

.idea a {
  color: var(--muted);
}

main {
  flex: 1;
  display: flex;
  justify-content: center;
  min-height: 0;
  background: #000;
}

iframe {
  width: 100%;
  height: 100%;
  border: 0;
  background: #0f0f0f;
}

main.is-phone iframe {
  width: 390px;
  border-left: 1px solid var(--line);
  border-right: 1px solid var(--line);
}
</style>
</head>
<body>
<header>
  <span class="round">Save fills · round 2</span>
  <nav id="scenes"></nav>
  <nav id="tabs"></nav>
  <div class="opts">
    <button id="replay" type="button">Play it</button>
    <button id="slow" type="button" aria-pressed="false">Slow ×4</button>
    <button id="light" type="button" aria-pressed="false">Light</button>
    <button id="phone" type="button" aria-pressed="false">Phone</button>
  </div>
  <div class="idea" id="idea"></div>
</header>
<main id="stage"><iframe id="frame" title="Variant"></iframe></main>
<script>
const VARIANTS = [
  { key: 'd', label: 'D, A fixed', idea: 'A with two fixes. The button keeps room for "Stashed", so nothing beside it moves when the word changes. On the pill, the white outline only shows above the water, so no white lines sit under the blue and nothing pops at the end.' },
  { key: 'a', label: 'A, Rise', idea: 'The bookmark is a small glass. Blue water rises from the bottom with a wave that sloshes and settles, and the bookmark bobs once when full. Taking it out lowers the water.' },
  { key: 'b', label: 'B, Drop', idea: 'The glass\'s picked motion. One drop falls into the top of the bookmark with a small ring, the water rises fast, and the bookmark bobs. Taking it out, the water drains and a drop falls out of the notch.' },
  { key: 'c', label: 'C, Tide', idea: 'The whole button fills. Light blue water rises through the button and the bookmark turns blue as the line passes it. Stashed, the button stays soft blue. Taking it out, the tide runs out.' },
  { key: 'now', label: 'As built', idea: 'Today: the card\'s button turns a darker gray and says Stashed; the pill swaps the outline for the filled bookmark.' },
];
const SCENES = [
  { key: 'card', label: 'Home card' },
  { key: 'pill', label: 'Watch page pill' },
];
const params = new URLSearchParams(location.search);
let current = params.get('v') || 'd';
let scene = params.get('scene') === 'pill' ? 'pill' : 'card';
const flags = { slow: params.get('slow') === '1', light: params.get('light') === '1', phone: params.get('phone') === '1' };
const tabs = document.getElementById('tabs');
const frame = document.getElementById('frame');

function src(auto) {
  const q = new URLSearchParams();
  if (auto) q.set('auto', '1');
  if (flags.slow) q.set('slow', '4');
  if (flags.light) q.set('theme', 'light');
  q.set('scene', scene);
  q.set('t', Date.now());
  return `${current}.html?${q}`;
}

function render() {
  tabs.replaceChildren(...VARIANTS.map((v) => {
    const b = document.createElement('button');
    b.type = 'button';
    b.textContent = v.label;
    b.setAttribute('aria-pressed', String(v.key === current));
    b.onclick = () => { current = v.key; render(); };
    return b;
  }));
  document.getElementById('scenes').replaceChildren(...SCENES.map((x) => {
    const b = document.createElement('button');
    b.type = 'button';
    b.textContent = x.label;
    b.setAttribute('aria-pressed', String(x.key === scene));
    b.onclick = () => { scene = x.key; render(); };
    return b;
  }));
  const v = VARIANTS.find((x) => x.key === current);
  const idea = document.getElementById('idea');
  idea.textContent = `${v.idea} `;
  const open = document.createElement('a');
  open.href = `${current}.html?scene=${scene}`;
  open.target = '_blank';
  open.textContent = 'Open alone';
  idea.append(open, ' · Click Stash in the page to try it, or Play it to watch it stash and come back out.');
  for (const k of Object.keys(flags)) document.getElementById(k).setAttribute('aria-pressed', String(flags[k]));
  document.getElementById('stage').classList.toggle('is-phone', flags.phone);
  const q = new URLSearchParams({ v: current, scene });
  for (const k of Object.keys(flags)) if (flags[k]) q.set(k, '1');
  history.replaceState(null, '', `?${q}`);
  frame.src = src();
}

for (const k of Object.keys(flags)) document.getElementById(k).onclick = () => { flags[k] = !flags[k]; render(); };
document.getElementById('replay').onclick = () => { frame.src = src(true); };
render();
</script>
</body>
</html>
