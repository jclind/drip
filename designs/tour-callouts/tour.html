<!doctype html>
<meta charset="utf-8">
<title>drip tour callouts</title>
<script>
  // dev/page.html for the welcome page only. ?v=a, b, or c picks a round 1 variant, which loads its script and styles;
  // ?v=d, e, or f picks a round 2 one, which the page draws itself.
  // For round 1, &live=1 adds the playing player. &mode=curated (or quiet) starts the page as if that mode were saved.
  // The theme follows Chrome's; index.html sets it on its frame. Serve the worktree's root and open
  // /designs/tour-callouts/tour.html?v=d#tour-1.
  (() => {
  const listeners = { addListener() {}, removeListener() {} };
  const params = new URLSearchParams(location.search);
  const mode = params.get('mode');
  /** @type {any} */
  let state = null;
  /** @type {any} */ (window).chrome = {
    runtime: {
      id: 'dev',
      getURL: (/** @type {string} */ p) => `/${p}`,
      openOptionsPage() {},
      onMessage: listeners,
      sendMessage(/** @type {any} */ msg) {
        const D = /** @type {any} */ (globalThis).Drip;
        if (!D) return Promise.resolve({ ok: true });
        if (!state) {
          state = D.initialState(Date.now());
          if (mode && D.MODES[mode]) Object.assign(state.settings, D.MODES[mode]);
        }
        const res = msg.type === 'updateSettings' ? D.updateSettings(state, msg.changes, Date.now()) : { ok: true };
        return Promise.resolve({ ...res, state: structuredClone(state) });
      },
    },
    storage: { onChanged: listeners, local: { get: async () => ({}) } },
    windows: { getCurrent: async () => ({}) },
    tabs: { query: async () => [] },
  };
  fetch('/src/welcome/welcome.html', { cache: 'no-store' }).then((r) => r.text()).then((html) => {
    // Round 1 (a, b, c) is a layer on top of the page. Round 2 (d, e, f) is built into the page, in src/welcome/coach.js.
    const round1 = ['a', 'b', 'c'].includes(params.get('v') || 'a');
    const extra = round1 ? `<link rel="stylesheet" href="/designs/tour-callouts/variants.css?${Date.now()}">`
      + `<script src="/designs/tour-callouts/variants.js?${Date.now()}"><\/script>` : '';
    // The queries keep Chrome from serving an old copy while the mockups change.
    const fresh = html.replace(/(src|href)="(coach|welcome)\.(js|css)"/g, `$1="$2.$3?${Date.now()}"`);
    document.open();
    document.write(fresh.replace('<head>', '<head><base href="/src/welcome/">').replace('</body>', `${extra}</body>`));
    document.close();
  });
  })();
</script>
