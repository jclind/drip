<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Links into Settings</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap">
<link rel="stylesheet" href="base.css">
<style>
  body { background: #0f0f0f; color: #f1f1f1; }
  main { max-width: 980px; margin: 0 auto; padding: 40px 16px 80px; }
  h1 { font-size: 24px; font-weight: 500; margin: 0 0 6px; }
  .intro { color: #aaa; margin: 0 0 12px; max-width: 640px; }
  .target { display: flex; gap: 10px; align-items: center; color: #aaa; margin-bottom: 32px; flex-wrap: wrap; }
  .target .segmented { background: #272727; }
  .target .segmented button { color: #f1f1f1; }
  .target .segmented button[aria-checked="true"] { background: #fff; color: #0f0f0f; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(290px, 1fr)); gap: 28px; }
  figure { margin: 0; }
  figcaption { color: #aaa; font-size: 13px; margin-top: 12px; line-height: 1.5; }
  figcaption b { color: #f1f1f1; font-weight: 500; }
  .stage { min-height: 360px; display: grid; place-items: center; border-radius: 16px; background: #000; padding: 20px; }

  /* The new links, in drip's gray, so they sit below the buttons and don't compete with them. */
  a.into { color: #aaa; font-size: 13px; font-weight: 500; text-decoration: none; display: inline-flex; gap: 6px; align-items: center; border-radius: 6px; }
  a.into:hover { color: #f1f1f1; text-decoration: underline; }
  a.into .i { width: 14px; height: 14px; color: currentColor; }
  .new { outline: 1px dashed #42a5f6; outline-offset: 4px; }

  /* Lock, after drip-page-demos/lock-screen-with-time.png. */
  .lock { width: 100%; max-width: 330px; padding: 28px 24px 22px; border-radius: 16px; background: #1a1a1a; text-align: center; }
  .lock h3 { margin: 0 0 6px; font-size: 21px; font-weight: 500; }
  .lock p { margin: 0 0 18px; color: #8a8a8a; font-size: 13px; font-weight: 500; }
  .lock .btns { display: flex; gap: 8px; justify-content: center; }
  .lock .btns button { padding: 10px 14px; border-radius: 21px; font-size: 13px; }
  .lock .plus { background: #272727; color: #f1f1f1; display: inline-flex; gap: 6px; align-items: center; }
  .lock .done { background: #fff; color: #0f0f0f; }
  .lock .need { margin: 14px 0 0; color: #8a8a8a; font-size: 13px; font-weight: 500; }
  .lock .foot { margin-top: 16px; padding-top: 12px; border-top: 1px solid rgba(255,255,255,.08); }

  /* Reveal card, after the home page's card. */
  .rcard { width: 100%; max-width: 330px; }
  .thumb { aspect-ratio: 16 / 9; border-radius: 12px; background: linear-gradient(160deg, #3b5d3a, #8fb46a 55%, #2c4a2a); position: relative; }
  .thumb span { position: absolute; right: 6px; bottom: 6px; padding: 1px 5px; border-radius: 4px; background: rgba(0,0,0,.8); font-size: 12px; font-weight: 500; }
  .rcard .title { margin: 10px 0 4px; font-size: 14px; font-weight: 500; line-height: 1.4; }
  .rcard .meta { display: flex; justify-content: space-between; align-items: center; color: #aaa; font-size: 13px; font-weight: 500; }
  .rcard .watch { background: #fff; color: #0f0f0f; padding: 8px 16px; border-radius: 20px; }
  .rcard .row { display: flex; gap: 8px; margin-top: 12px; }
  .rcard .row button { background: #272727; color: #f1f1f1; border-radius: 20px; padding: 9px 14px; display: inline-flex; gap: 6px; align-items: center; }
  .rcard .row .next { flex: 1; justify-content: center; }
  .rcard .row .x { padding: 9px 11px; }
  .rcard .foot { margin-top: 12px; text-align: center; }

  /* Popup, after the real popup. */
  .popup { width: 275px; padding: 22px 18px 14px; border-radius: 12px; background: #0f0f0f; outline: 1px solid #272727; }
  .pop-top { display: flex; gap: 12px; justify-content: center; align-items: center; }
  .glass { width: 52px; height: 52px; border-radius: 12px; background: #272727; display: grid; place-items: center; }
  .glass i { display: block; width: 20px; height: 24px; border: 2px solid #d9d9d9; border-top: 0; border-radius: 0 0 4px 4px; background: linear-gradient(transparent 55%, #42a5f6 55%); }
  .pop-time b { display: block; font-size: 24px; font-weight: 500; line-height: 1.1; }
  .pop-time span { color: #aaa; font-size: 13px; }
  .pop-counts { display: flex; gap: 22px; justify-content: center; margin: 12px 0 18px; }
  .pop-counts a { color: #f1f1f1; text-decoration: none; display: inline-flex; gap: 6px; align-items: center; font-weight: 500; padding: 3px 8px; border-radius: 8px; }
  .pop-counts a:hover { background: #272727; }
  .pop-links { display: flex; justify-content: space-between; }
  .pop-links a { color: #aaa; text-decoration: none; font-size: 13px; font-weight: 500; display: inline-flex; gap: 6px; align-items: center; }
  .pop-links .i { width: 14px; height: 14px; color: currentColor; }
</style>
</head>
<body>
<main>
  <h1>Links into Settings</h1>
  <p class="intro">Each new link is outlined in blue dashes. Click one: it opens the variant picked below at that section, which flashes once. These links would also work with today's Settings page.</p>
  <div class="target">Open in
    <div class="segmented" role="radiogroup" aria-label="Variant">
      <button type="button" role="radio" aria-checked="true" data-v="a">A, Folds</button>
      <button type="button" role="radio" aria-checked="false" data-v="b">B, Two panes</button>
      <button type="button" role="radio" aria-checked="false" data-v="c">C, Sentences</button>
    </div>
  </div>

  <div class="grid">
    <figure>
      <div class="stage">
        <div class="lock">
          <h3>Time for a breather.</h3>
          <p>1h 15m watched today · 50m last Tuesday</p>
          <div class="btns"><button class="plus" type="button">+15m · -1 <span class="i i-drop" style="width:12px;height:14px"></span></button><button class="done" type="button">Done for now</button></div>
          <p class="need">I need this one · 2 left</p>
          <div class="foot"><a class="into new" data-to="watch" href="#">Change your daily drops</a></div>
        </div>
      </div>
      <figcaption><b>Lock.</b> One gray line at the bottom, under "I need this one", so it's the last thing you see. It goes to Watch time. Judgment call: a link here invites raising the limit at the weakest moment, but Q6 makes a raise wait for tomorrow anyway.</figcaption>
    </figure>

    <figure>
      <div class="stage">
        <div class="rcard">
          <div class="thumb"><span>5:05</span></div>
          <div class="title">I Spent 30 Days Building a Cabin in the Woods With Only Hand Tools (Full Build)</div>
          <div class="meta"><span>Rogi</span><button class="watch" type="button">Watch</button></div>
          <div class="row"><button type="button"><span class="i i-save" style="width:14px;height:16px"></span>Stash</button><button class="next" type="button">Reveal next · -1 <span class="i i-card" style="width:12px;height:14px"></span></button><button class="x" type="button" aria-label="Pass"><span class="i i-x" style="width:14px;height:14px"></span></button></div>
          <div class="foot"><a class="into new" data-to="cards" href="#"><span class="i i-settings"></span>What reveals show</a></div>
        </div>
      </div>
      <figcaption><b>Reveal card.</b> A gray line under the buttons, to Cards: how many a day, which feed, and live streams. Later the channel lists would sit here too ("Never show Rogi").</figcaption>
    </figure>

    <figure>
      <div class="stage">
        <div class="popup">
          <div class="pop-top"><div class="glass"><i></i></div><div class="pop-time"><b>34m</b><span>left today</span></div></div>
          <div class="pop-counts">
            <a class="new" data-to="watch" href="#" title="Watch time settings"><span class="i i-drop"></span>4</a>
            <a class="new" data-to="cards" href="#" title="Cards settings"><span class="i i-card"></span>10</a>
          </div>
          <div class="pop-links"><a data-to="" href="#"><span class="i i-settings"></span>Settings</a><a href="#">Open YouTube <span class="i i-out"></span></a></div>
        </div>
      </div>
      <figcaption><b>Popup.</b> The drop and card counts become links to their sections, with a hover fill so they read as clickable. Settings stays as it is and opens the top of the page.</figcaption>
    </figure>
  </div>
</main>
<script>
  let variant = 'a';
  document.querySelector('.target').addEventListener('click', (e) => {
    const b = e.target.closest('[data-v]');
    if (!b) return;
    variant = b.dataset.v;
    for (const x of document.querySelectorAll('[data-v]')) x.setAttribute('aria-checked', String(x === b));
  });
  document.addEventListener('click', (e) => {
    const a = e.target.closest('a[data-to]');
    if (!a) return;
    e.preventDefault();
    // Inside the switcher, tell it to show the variant; on its own, just go there.
    const url = `${variant}.html${a.dataset.to ? '#' + a.dataset.to : ''}`;
    if (parent !== window) parent.postMessage({ open: variant, url }, '*');
    else location.href = url;
  });
</script>
</body>
</html>
