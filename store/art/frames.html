<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>drip store frames</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap">
<!--
  The Chrome Web Store images, drawn from drip's real pages through the dev harness. Serve the repo root and open:
    /store/art/frames.html?shot=1   (1 to 5, 1280x800)
    /store/art/frames.html?tile=a   (a, b, or c, 440x280)
  store/art/capture.sh screenshots every frame into store/images/. ART-PLAN.md has the reasons.
-->
<style>
  :root { --bg: #0a1422; --text: #f1f1f1; --muted: #b4c2d3; --blue: #42a5f6; --gold: #fdc905; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); font-family: Roboto, Arial, sans-serif; overflow: clip; }
  .shot { position: relative; width: 1280px; height: 800px; overflow: clip; background: var(--bg); }
  .copy { position: absolute; left: 72px; top: 0; bottom: 0; width: 400px; display: flex; flex-direction: column; justify-content: center; }
  .brand { position: absolute; left: 72px; bottom: 56px; display: flex; align-items: center; gap: 10px; font-size: 26px; font-weight: 700; letter-spacing: -0.5px; }
  .mask { display: inline-block; background: currentColor; -webkit-mask: var(--src) center / contain no-repeat; mask: var(--src) center / contain no-repeat; }
  .drop { --src: url(/src/icons/drop.svg); color: var(--blue); aspect-ratio: 600 / 893; }
  .card { --src: url(/src/icons/card.svg); color: var(--gold); aspect-ratio: 600 / 697; }
  .brand .drop { height: 30px; }
  h1 { white-space: pre-line; margin: 0 0 20px; font-size: 46px; line-height: 1.12; font-weight: 500; letter-spacing: -1px; }
  .copy p { white-space: pre-line; margin: 0; font-size: 20px; line-height: 1.45; color: var(--muted); }
  /* The page runs off the right and bottom edges, like a window cropped, rather than a card floating in a gradient. */
  .panel { position: absolute; right: 0; top: 64px; width: 744px; height: 736px; border-top-left-radius: 12px; overflow: hidden;
    background: #0f0f0f; border: solid rgba(255, 255, 255, 0.2); border-width: 1px 0 0 1px; }
  .panel iframe { position: absolute; border: 0; transform-origin: 0 0; background: #0f0f0f; }

  .tile { position: relative; width: 440px; height: 280px; overflow: hidden; background: var(--bg); }
  .tile .word { font-weight: 700; letter-spacing: -2px; }
</style>
</head>
<body>
<script>
  // @ts-check
  const params = new URLSearchParams(location.search);

  /**
   * Each shot: the caption, the harness page, the iframe's size and offset in the panel, and what to do inside it once
   * it's drawn: CSS to hide harness parts or tour notes, and an optional step (a click, a scroll).
   * @type {Record<string, {h: string, p: string, src: string, w: number, h2: number, x?: number, y?: number, scale?: number, motion?: boolean, css?: string, ready: string, step?: (d: Document) => void}>}
   */
  const SHOTS = {
    1: {
      h: 'One video at a time.',
      p: 'drip replaces YouTube\'s home feed.\nA card reveals each new video.',
      src: '/dev/home.html?scenario=saved&theme=dark&reduced=1&videos=store',
      w: 620, h2: 656, x: -46, y: -157, scale: 1.35,
      css: '#masthead, #harness-bar { visibility: hidden !important; }',
      ready: '.drip-thumb img.is-loaded',
    },
    2: {
      h: 'Out of minutes?\nThe lock comes up.',
      p: 'Limits are optional. A spare drop\nadds 15 minutes, or call it a day.',
      src: '/dev/page.html?page=welcome#tour-4',
      // The tour's stage alone, filling the panel. It sits at 362 to 921 across and 231 to 729 down in the page; x and y are panel pixels, before the scale.
      w: 1280, h2: 800, x: -590, y: -347, scale: 1.5,
      motion: true,
      // Roboto, as on YouTube: the welcome page doesn't load it, so its lock fell back to Arial. The spark that circles
      // "Done for now" reads as a glitch in a still, and the pill under the water showed as a clipped word, so both are
      // hidden. The tour's paused player gets screenshot 1's ride, brightened so it shows through the lock's tint and blur.
      css: `@import url('https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap');
        #drip-lock, #drip-lock * { font-family: Roboto, Arial, sans-serif !important; }
        .co-layer, .tour-again, .tour-under #drip-pill, #drip-lock .drip-orbit, #drip-lock .drip-orbit-spark, #drip-lock .drip-orbit-star { display: none !important; }
        .tour-stage { border-color: transparent !important; }
        .tour-player { background: url(/store/art/thumbs/store-trail.svg) center / cover !important; filter: brightness(1.8) saturate(1.3); }
        .tour-player-play, .tour-player-bar { display: none !important; }`,
      ready: '#drip-lock .drip-lock-sub',
      // The tour runs on a fresh state, so its lock says "0m watched today". The default day is 4 drops of 15 minutes.
      // Headless Chrome doesn't advance animation time in the iframe, so every animation is set by hand: the water, page
      // fades, and the panel's rise finished, and the bubbles placed up the water so it reads as water. sea() places the
      // bubbles at random; these fix them, so every capture is the same.
      step: (d) => setTimeout(() => {
        /** @type {HTMLElement} */ (d.querySelector('#drip-lock .drip-lock-sub')).textContent = '1h watched today';
        // [left %, size px, how far up]. The crop shows about 6% to 94% across, so these stay inside it, and low, where the
        // water is deep: higher up they read as dust (round 3).
        const BUBBLES = [[14, 9, 0.22], [22, 5, 0.08], [33, 7, 0.3], [68, 6, 0.05], [76, 10, 0.18], [84, 5, 0.27], [88, 7, 0.12], [52, 4, 0.33]];
        d.querySelectorAll('#drip-lock .drip-bubble').forEach((el, i) => {
          const [x, size] = BUBBLES[i % BUBBLES.length];
          const b = /** @type {HTMLElement} */ (el);
          b.style.setProperty('--x', `${x}%`);
          b.style.setProperty('--size', `${size}px`);
          b.style.setProperty('--rise', '10s');
          b.style.setProperty('--delay', '0s');
        });
        d.querySelectorAll('#drip-lock .drip-bubble').forEach((el, i) => {
          for (const a of el.getAnimations()) {
            if (/bubble-rise/.test(/** @type {CSSAnimation} */ (a).animationName)) a.currentTime = 10000 * BUBBLES[i % BUBBLES.length][2];
          }
        });
        // Round 2 tried stopping the water partway (with --tour-depth set by hand, since headless Chrome reads the stage
        // as 0px tall when the tour sets it). Above the line the tour's player is a plain gray box, so the crest read as
        // a header bar, not water. The water stays all the way up.
        d.getAnimations().forEach((a) => {
          const name = /** @type {CSSAnimation} */ (a).animationName || '';
          if (/bubble-rise/.test(name)) { a.pause(); return; }
          if (/swim|bob|sway/.test(name)) a.currentTime = 3000;
          else { try { a.finish(); } catch { a.currentTime = 5000; } }
          a.pause();
        });
      }, 600),
    },
    3: {
      h: 'Three levels.\nSwitch any time.',
      p: 'Search only, one video at a time,\nor a daily limit.',
      src: '/dev/page.html?page=welcome',
      w: 680, h2: 713, x: -17, y: -120, scale: 1.15,
      css: '',
      ready: 'input[type=radio], [role=radio]',
    },
    4: {
      h: 'Set your\ndaily limit.',
      p: 'Each drop is 15 minutes of watching.\nChoose the hours drops can\'t be used.',
      src: '/dev/page.html?page=options&settled=1&sample=1',
      // From the tabs through Dry hours' end time, larger, so fewer rows read in the carousel. The page's own "drip"
      // title repeats the frame's mark, so it's hidden.
      w: 728, h2: 588, x: -82, y: -88, scale: 1.25,
      css: 'h1 { visibility: hidden !important; }',
      ready: '[role=tab]',
      // The frame is shorter than the page, so keep it scrolled to the top.
      step: (d) => setTimeout(() => d.scrollingElement?.scrollTo(0, 0), 300),
    },
    5: {
      h: 'See where\nyour time went.',
      p: 'Each day\'s watch time against\nlast week\'s average.',
      src: '/dev/page.html?page=options&settled=1&sample=1#history',
      // The week's card alone, as large as fits, so it reads as the page and not a card in a panel. The tabs and the
      // unlock reasons don't fit with it.
      w: 728, h2: 840, x: -36, y: -197, scale: 1.12,
      css: '[role=tablist] { visibility: hidden !important; }',
      ready: '[data-k=earlier]',
      // This week starts on Sunday, so early in the week the chart is mostly empty. Last week is a full one. The frame is
      // shorter than the tab, so the page scrolls to #history on its own; put it back at the top.
      step: (d) => {
        /** @type {HTMLElement} */ (d.querySelector('[data-k=earlier]')).click();
        setTimeout(() => d.scrollingElement?.scrollTo(0, 0), 300);
      },
    },
  };

  const shot = SHOTS[params.get('shot') || ''];
  const tile = params.get('tile');

  if (shot) {
    document.body.innerHTML = `
      <div class="shot">
        <div class="copy"><h1></h1><p></p></div>
        <div class="brand"><span class="mask drop"></span>drip</div>
        <div class="panel"><iframe></iframe></div>
      </div>`;
    /** @type {HTMLElement} */ (document.querySelector('h1')).textContent = shot.h;
    /** @type {HTMLElement} */ (document.querySelector('.copy p')).textContent = shot.p;
    const frame = /** @type {HTMLIFrameElement} */ (document.querySelector('iframe'));
    Object.assign(frame.style, {
      width: `${shot.w}px`, height: `${shot.h2}px`, left: `${shot.x || 0}px`, top: `${shot.y || 0}px`,
      transform: shot.scale ? `scale(${shot.scale})` : '',
    });
    frame.src = shot.src;
    // page.html rewrites its own document, so keep checking: put the style in whatever document is there now, and run
    // the step once the page has drawn what this shot needs.
    let stepped = false;
    const poll = setInterval(() => {
      const d = frame.contentDocument;
      if (!d || !d.head) return;
      if (shot.css && !d.getElementById('store-frame-css')) {
        const style = d.createElement('style');
        style.id = 'store-frame-css';
        style.textContent = shot.css;
        d.head.append(style);
      }
      if (!stepped && d.querySelector(shot.ready)) {
        stepped = true;
        shot.step?.(d);
        document.documentElement.dataset.ready = '1';
      }
    }, 100);
    setTimeout(() => clearInterval(poll), 8000);
  } else if (tile) {
    const tiles = {
      // The drop and the card side by side, the wordmark under them.
      a: `<div class="tile" style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px">
            <div style="display:flex;align-items:flex-end;gap:18px">
              <span class="mask drop" style="height:104px"></span>
              <span class="mask card" style="height:78px;transform:rotate(8deg)"></span>
            </div>
            <div class="word" style="font-size:54px;line-height:1">drip</div>
          </div>`,
      // The drop large on the left, wordmark and one line on the right.
      b: `<div class="tile" style="display:flex;align-items:center;gap:26px;padding-left:56px">
            <span class="mask drop" style="height:150px"></span>
            <div>
              <div class="word" style="font-size:72px;line-height:0.95">drip</div>
              <div style="font-size:19px;color:var(--muted);margin-top:10px">One video at a time.</div>
            </div>
          </div>`,
      // The drop alone, centered, wordmark beside it.
      c: `<div class="tile" style="display:flex;align-items:center;justify-content:center;gap:16px">
            <span class="mask drop" style="height:106px"></span>
            <div class="word" style="font-size:92px;line-height:1">drip</div>
          </div>`,
    };
    // Round 2 (2026-11-09): c with one cue to what drip does, as the Claude judge asked. Jesse wants c kept as well.
    Object.assign(tiles, {
      // c with a line under the wordmark.
      d: `<div class="tile" style="display:flex;align-items:center;justify-content:center;gap:22px">
            <span class="mask drop" style="height:112px"></span>
            <div>
              <div class="word" style="font-size:86px;line-height:0.9;letter-spacing:-3px">drip</div>
              <div style="font-size:18px;color:var(--muted);margin-top:8px">One video at a time.</div>
            </div>
          </div>`,
      // Round 3: d with the line about 1.3x larger and brighter, the drop back at c's size, centered on the text block.
      d2: `<div class="tile" style="display:flex;align-items:center;justify-content:center;gap:20px">
            <span class="mask drop" style="height:100px"></span>
            <div>
              <div class="word" style="font-size:78px;line-height:0.9;letter-spacing:-3px">drip</div>
              <div style="font-size:23px;font-weight:500;color:#d5dee8;margin-top:8px;letter-spacing:-0.2px">One video at a time.</div>
            </div>
          </div>`,
      // Round 4: d2 with a larger wordmark (Codex) and line (Claude), and less gap between them.
      d3: `<div class="tile" style="display:flex;align-items:center;justify-content:center;gap:20px">
            <span class="mask drop" style="height:104px"></span>
            <div>
              <div class="word" style="font-size:86px;line-height:0.88;letter-spacing:-3px">drip</div>
              <div style="font-size:26px;font-weight:500;color:#d5dee8;margin-top:4px;letter-spacing:-0.3px">One video at a time.</div>
            </div>
          </div>`,
      // c with the gold card beside the drop.
      e: `<div class="tile" style="display:flex;align-items:center;justify-content:center;gap:16px">
            <div style="display:flex;align-items:flex-end;gap:6px">
              <span class="mask drop" style="height:100px"></span>
              <span class="mask card" style="height:62px;transform:rotate(10deg);margin-bottom:2px"></span>
            </div>
            <div class="word" style="font-size:88px;line-height:1;letter-spacing:-3px">drip</div>
          </div>`,
    });
    document.body.innerHTML = tiles[/** @type {'a'|'b'|'c'|'d'|'d2'|'d3'|'e'} */ (tile)] || '';
    document.documentElement.dataset.ready = '1';
  }
</script>
</body>
</html>
