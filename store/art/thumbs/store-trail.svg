<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <!-- Drawn by hand for the store images: a rider climbing a ridge trail, a storm coming in from the left, and a break of
       light to the right. No real thumbnail. Round 7 drew it with a small rider on the crest; the design-thumb round
       (2026-11-09) made the rider about four times the size, and Jesse picked that version ("A, Closer"). -->
<defs>
