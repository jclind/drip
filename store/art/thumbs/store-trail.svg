<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <!-- Drawn by hand for the store images (round 7, 2026-11-09): a rider on a ridge, a storm coming in from the left,
       and a break of light to the right that the rider is heading for. No real thumbnail. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="0.6">
      <stop offset="0" stop-color="#263042"/>
      <stop offset="0.5" stop-color="#5d6677"/>
      <stop offset="0.85" stop-color="#c9ab7c"/>
      <stop offset="1" stop-color="#e8c891"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.74" cy="0.52" r="0.32">
      <stop offset="0" stop-color="#ffe2a8" stop-opacity="0.95"/>
      <stop offset="0.5" stop-color="#f3cf8e" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#f3cf8e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="far" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a6479"/>
      <stop offset="1" stop-color="#434c60"/>
    </linearGradient>
    <linearGradient id="mid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b5444"/>
      <stop offset="1" stop-color="#22322a"/>
    </linearGradient>
    <linearGradient id="near" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1f2b21"/>
      <stop offset="1" stop-color="#0d130f"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="720" fill="url(#sky)"/>
  <rect width="1280" height="720" fill="url(#glow)"/>
  <!-- the storm: one heavy mass with a ragged underside, thinning to the right -->
  <path d="M0 0 H1010 C 990 40 940 52 900 60 C 930 92 880 118 830 112 C 800 150 730 150 700 132 C 670 170 600 176 560 150
           C 530 196 450 204 410 176 C 380 222 300 236 250 208 C 210 250 130 262 80 236 C 50 262 20 266 0 258 Z" fill="#1c2330" opacity="0.92"/>
  <path d="M0 210 C 60 236 140 220 190 246 C 250 230 320 262 380 240 C 430 262 500 246 540 262 C 520 290 430 300 360 288
           C 290 306 200 300 140 288 C 90 300 30 296 0 290 Z" fill="#2a3242" opacity="0.7"/>
  <!-- rain under the storm, uneven -->
  <g stroke="#a7b2c6" stroke-linecap="round" opacity="0.4">
    <line x1="42" y1="286" x2="22" y2="382" stroke-width="2"/>
    <line x1="96" y1="300" x2="80" y2="372" stroke-width="1.5"/>
    <line x1="141" y1="296" x2="118" y2="420" stroke-width="2.5"/>
    <line x1="203" y1="304" x2="190" y2="358" stroke-width="1.5"/>
    <line x1="238" y1="300" x2="214" y2="404" stroke-width="2"/>
    <line x1="296" y1="306" x2="281" y2="372" stroke-width="1.5"/>
    <line x1="331" y1="298" x2="312" y2="388" stroke-width="2"/>
    <line x1="390" y1="300" x2="378" y2="346" stroke-width="1.5"/>
    <line x1="428" y1="294" x2="412" y2="370" stroke-width="2"/>
    <line x1="472" y1="286" x2="464" y2="322" stroke-width="1.5"/>
  </g>
  <!-- far range -->
  <path d="M0 410 L90 372 L150 388 L230 336 L300 362 L380 318 L450 352 L520 330 L600 366 L690 322 L760 348 L840 300
           L910 334 L990 312 L1080 352 L1160 326 L1280 346 V720 H0 Z" fill="url(#far)"/>
  <!-- the ridge the rider is on: its crest sits against the light -->
  <path d="M0 500 C 120 470 220 452 330 446 C 430 440 520 420 610 404 C 680 392 740 382 800 384 C 880 388 950 410 1030 430
           C 1120 452 1200 470 1280 478 V720 H0 Z" fill="url(#mid)"/>
  <path d="M0 720 V600 C 160 572 300 566 460 584 C 620 602 760 640 940 632 C 1080 626 1180 600 1280 590 V720 Z" fill="url(#near)"/>
  <!-- the trail climbing to the crest -->
  <path d="M90 720 C 210 650 330 600 450 560 C 560 522 640 470 700 430 C 730 410 760 392 786 386" fill="none" stroke="#c4a573" stroke-width="9" stroke-linecap="round" opacity="0.85"/>
  <path d="M786 386 C 840 384 900 398 960 414" fill="none" stroke="#c4a573" stroke-width="6" stroke-linecap="round" opacity="0.6"/>
  <!-- the rider, on the crest, against the light -->
  <g transform="translate(792 340)" fill="none" stroke="#0b0e0c" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="-24" cy="26" r="19"/>
    <circle cx="28" cy="26" r="19"/>
    <path d="M-24 26 L-4 0 L20 0 L28 26 M-4 0 L6 26 L20 0"/>
    <path d="M-8 -4 L4 -32 L18 -14" stroke-width="7.5"/>
    <circle cx="6" cy="-42" r="8" fill="#0b0e0c" stroke="none"/>
  </g>
</svg>
