    <radialGradient id="glow" cx="0.74" cy="0.52" r="0.32"><stop offset="0" stop-color="#ffe2a8" stop-opacity="0.95"/><stop offset="0.5" stop-color="#f3cf8e" stop-opacity="0.35"/><stop offset="1" stop-color="#f3cf8e" stop-opacity="0"/></radialGradient>
    <linearGradient id="mid" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4a6a52"/><stop offset="1" stop-color="#2d4335"/></linearGradient>
    <linearGradient id="near" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2c3c2e"/><stop offset="1" stop-color="#172119"/></linearGradient>
  </defs>
