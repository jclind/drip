<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>drip store frames, v2</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,500&family=Roboto:wght@400;500;700&display=swap">
<!--
  The second layout for the store images (round 5, 2026-11-09). Rounds 0 to 4 used frames.html: a headline on the left
  and the page in a rounded panel on a dark navy frame. Both judges named that structure as the template signal.
  This one is a paper page: a serif headline at the top left, the real extension page as a full-height strip on the
  right, and a few notes with leader lines pointing at real elements in it. Serve the repo root and open:
    /store/art/frames-v2.html?shot=1   (1 to 5, 1280x800)
    /store/art/frames-v2.html?tile=c   (440x280)
  store/art/capture.sh v2 screenshots every frame into store/images-v2/.
-->
<style>
  :root { --paper: #f1ede4; --ink: #1c1b19; --soft: #5b5750; --blue: #1b74c9; --drop: #42a5f6; --gold: #fdc905; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--paper); color: var(--ink); font-family: Roboto, Arial, sans-serif; overflow: clip; }
  .shot { position: relative; width: 1280px; height: 800px; overflow: clip; background: var(--paper); }
  .copy { position: absolute; left: 72px; top: 112px; width: 430px; }
  h1 { margin: 0 0 18px; font-family: Newsreader, Georgia, serif; font-weight: 500; font-size: 54px; line-height: 1.04;
    letter-spacing: -1.2px; white-space: pre-line; min-height: 112px; }
  .copy p { margin: 0; font-size: 19px; line-height: 1.5; color: var(--soft); white-space: pre-line; }
  .brand { position: absolute; left: 72px; top: 44px; display: flex; align-items: center; gap: 9px; font-size: 24px;
    font-weight: 700; letter-spacing: -0.5px; }
  .mask { display: inline-block; background: currentColor; -webkit-mask: var(--src) center / contain no-repeat; mask: var(--src) center / contain no-repeat; }
  .drop { --src: url(/src/icons/drop.svg); color: var(--drop); aspect-ratio: 600 / 893; }
  .card { --src: url(/src/icons/card.svg); color: var(--gold); aspect-ratio: 600 / 697; }
  .brand .drop { height: 27px; }
  /* The page, full height, flush right: a strip of the screen, not a card. */
  .panel { position: absolute; right: 0; top: 0; width: 720px; height: 800px; overflow: hidden; background: #0f0f0f; }
  .panel iframe { position: absolute; border: 0; transform-origin: 0 0; background: #0f0f0f; }
  /* Notes: a short line of text in the left column and a leader line to the thing it names. */
  .note { position: absolute; left: 72px; width: 380px; font-size: 20px; line-height: 1.3; color: var(--ink); white-space: pre-line; }
  .note b { font-weight: 500; }
  svg.leaders { position: absolute; inset: 0; pointer-events: none; overflow: visible; }
  .legend { position: absolute; left: 72px; display: grid; grid-template-columns: 34px auto; gap: 12px 12px; align-items: center;
    font-size: 20px; line-height: 1.3; }
  .legend .drop { height: 34px; justify-self: center; }
  .legend .card { height: 30px; justify-self: center; transform: rotate(8deg); }

  .tile { position: relative; width: 440px; height: 280px; overflow: hidden; background: var(--paper); color: var(--ink); }
  .tile .word { font-weight: 700; letter-spacing: -3px; }
</style>
</head>
<body>
<script>
  // @ts-check
  const params = new URLSearchParams(location.search);
  const PANEL_LEFT = 560;
  /** History's card color, measured from a capture. */
  const CARD_GRAY = 'rgb(39, 39, 39)';
  /**
   * Where shot 2 stops the lock's 1100ms rise: at the end. Round 6 tried partway, but the paused player sits behind the
   * lock's panel, so any crest high enough to clear the panel has only the stage's gray above it.
   */
  const WATER_AT = 1100;

  /**
   * Each shot: the caption, the harness page, the iframe's size and offset in the panel (panel pixels, before the
   * scale), CSS to put in the page, what has to exist before the step runs, an optional step, and notes. A note
   * names its target by selector or by exact text, and sits in the left column at the target's height when there's
   * room.
   * @typedef {{sel?: string, text?: string, say: string, top?: boolean}} Note
   * A shot's legend sits under the caption with no leader: drip's own drop and card, and what each one is.
   * @type {Record<string, {h: string, p: string, src: string, w: number, h2: number, x: number, y: number, scale: number, motion?: boolean, css?: string, ready: string, step?: (d: Document) => void, notes?: Note[], legend?: boolean, bg?: string}>}
   */
  const SHOTS = {
    1: {
      h: 'One video\nat a time.',
      p: 'drip hides YouTube\'s home feed and\npicks one video from it for you.',
      src: '/dev/home.html?scenario=card&theme=dark&reduced=1&videos=store',
      w: 620, h2: 656, x: -105, y: -177, scale: 1.5,
      css: '#masthead, #harness-bar { visibility: hidden !important; }',
      ready: '.drip-thumb img.is-loaded',
      legend: true,
      notes: [
        { sel: '[data-k=save]', say: 'Stash it, or pass.\nEach new pick uses a card.' },
      ],
    },
    2: {
      h: 'When the time\nruns out.',
      p: 'Your video pauses at the daily limit.\nLimits are optional.',
      src: '/dev/page.html?page=welcome#tour-4',
      // The tour's stage alone, full height, cropped past its blurred edges. It sits at 362 to 921 across and 231 to 729
      // down in the page.
      w: 1280, h2: 800, x: -730, y: -416, scale: 1.7,
      motion: true,
      // Roboto, as on YouTube: the welcome page doesn't load it. The spark that circles "Done for now" only makes sense
      // moving, and the pill under the water showed as a clipped word, so both are hidden. The paused player gets
      // screenshot 1's ride, brightened so it shows through the lock's tint and blur.
      css: `@import url('https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap');
        #drip-lock, #drip-lock * { font-family: Roboto, Arial, sans-serif !important; }
        .co-layer, .co-ring, .co-chip, .co-said, .co-head, .co-count, .tour-again, .tour-under #drip-pill, #drip-lock .drip-orbit, #drip-lock .drip-orbit-spark, #drip-lock .drip-orbit-star { display: none !important; }
        .tour-stage { border-color: transparent !important; border-radius: 0 !important; }
        .tour-player { background: url(/store/art/thumbs/store-trail.svg) center / cover !important; filter: brightness(1.8) saturate(1.3); }
        .tour-player-play, .tour-player-bar { display: none !important; }
        .tour-under { transform: scale(1.6); } .tour-player { border-radius: 0 !important; filter: brightness(2.2) contrast(1.2) saturate(1.3) !important; }
        #drip-lock .drip-done-ring { display: none !important; }`,
      ready: '#drip-lock .drip-lock-sub',
      // The tour runs on a fresh state, so its lock says "0m watched today"; the default day is 4 drops of 15 minutes.
      // Headless Chrome doesn't advance animation time in the iframe, so every animation is set by hand, and the
      // bubbles, which sea() places at random, are fixed so every capture is the same.
      step: (d) => setTimeout(() => {
        /** @type {HTMLElement} */ (d.querySelector('#drip-lock .drip-lock-sub')).textContent = '1h watched today';
        // The tour focuses "Done for now", and a focus ring in a still reads as a click someone made.
        /** @type {HTMLElement | null} */ (d.activeElement)?.blur();
        // [left %, size px, how far up], kept low where the water is deep and clear of the panel.
        // The crop shows about 12% to 88% across and loses the bottom 3%, so these stay inside it, low in the water, a few
        // sizes, larger than sea()'s so they read as bubbles in a still.
        const BUBBLES = [[22, 16, 0.2], [28, 10, 0.1], [34, 13, 0.28], [68, 12, 0.08], [75, 18, 0.18], [80, 10, 0.27], [44, 11, 0.06], [58, 14, 0.15]];
        d.querySelectorAll('#drip-lock .drip-bubble').forEach((el, i) => {
          const [x, size] = BUBBLES[i % BUBBLES.length];
          const b = /** @type {HTMLElement} */ (el);
          b.style.setProperty('--x', `${x}%`);
          b.style.setProperty('--size', `${size}px`);
          b.style.setProperty('--rise', '10s');
          b.style.setProperty('--delay', '0s');
        });
        d.querySelectorAll('#drip-lock .drip-bubble').forEach((el, i) => {
          for (const a of el.getAnimations()) {
            if (/bubble-rise/.test(/** @type {CSSAnimation} */ (a).animationName)) a.currentTime = 10000 * BUBBLES[i % BUBBLES.length][2];
          }
        });
        // The tour sets --tour-depth inside a view transition, where headless Chrome reads 0px. Set it properly, so the
        // rise's time means what it says.
        const lock = /** @type {HTMLElement} */ (d.getElementById('drip-lock'));
        lock.style.setProperty('--tour-depth', `${lock.offsetHeight}px`);
        d.getAnimations().forEach((a) => {
          const name = /** @type {CSSAnimation} */ (a).animationName || '';
          if (/bubble-rise/.test(name)) { a.pause(); return; }
          if (/water-rise|crest/.test(name)) { a.currentTime = WATER_AT; a.pause(); return; }
          if (/swim|bob|sway/.test(name)) a.currentTime = 3000;
          else { try { a.finish(); } catch { a.currentTime = 5000; } }
          a.pause();
        });
      }, 600),
      notes: [
        { sel: '#drip-lock .drip-lock-add', say: 'Spend a saved drop\nfor 15 more minutes.' },
        { sel: '#drip-lock .drip-bubble:nth-child(2)', say: 'Blue water fills the screen\nas the minutes run out.' },
      ],
    },
    3: {
      h: 'Choose\nhow strict.',
      p: 'Search only, one video at a time,\nor optional daily limits.',
      src: '/dev/page.html?page=welcome',
      w: 680, h2: 713, x: -49, y: -118, scale: 1.2,
      // The page's own logo and tagline repeat the frame's mark.
      css: '.hero { visibility: hidden !important; }',
      ready: 'input[type=radio], [role=radio]',
      notes: [
        { sel: '[data-mode=curated]', say: 'Curated keeps one at a time,\nwith no daily limit.' },
        { sel: '[data-mode=full]', say: 'Customize turns each part\nof Full drip on or off.' },
      ],
    },
    4: {
      h: 'Easy to tighten.\nSlow to loosen.',
      p: 'Cut your limit and it applies now.\nRaise it and it waits for tomorrow.',
      src: '/dev/page.html?page=options&settled=1&sample=1&pending=1',
      // From the tabs through Dry hours' end time. The page's own "drip" title repeats the mark, so it's hidden. The
      // sample raised drops from 4 to 5, so the row shows the waiting change.
      w: 728, h2: 584, x: -81, y: -40, scale: 1.22,
      css: 'h1 { visibility: hidden !important; }',
      ready: '[role=tab]',
      step: (d) => setTimeout(() => d.scrollingElement?.scrollTo(0, 0), 300),
      notes: [
        { text: 'Drops per day', say: 'Raised from 4 to 5 drops.\nIt starts at 4am tomorrow.' },
        { text: 'Dry hours', say: 'Dry hours: drops can\'t be\nspent from 11pm to 6am.' },
      ],
    },
    5: {
      h: 'Where your\nhour went.',
      p: 'Down 7 minutes a day\nfrom the week before.',
      src: '/dev/page.html?page=options&settled=1&sample=1#history',
      // The week's card, scaled so its edges fall just outside the strip and its gray is the strip's background.
      w: 728, h2: 762, x: -132, y: -258, scale: 1.35, bg: CARD_GRAY,
      // The capture ends above the summary line, which the crop would cut through, and the strip under it is the card's gray.
      css: '[role=tablist] { visibility: hidden !important; }',
      ready: '[data-k=earlier]',
      // This week starts on Sunday, so early in the week the chart is mostly empty. Last week is a full one. The frame is
      // shorter than the tab, so the page scrolls to #history on its own; put it back at the top.
      step: (d) => {
        /** @type {HTMLElement} */ (d.querySelector('[data-k=earlier]')).click();
        setTimeout(() => d.scrollingElement?.scrollTo(0, 0), 300);
      },
      notes: [
        { sel: '.avg-line', say: 'The dashed line is\nthe week before.' },
        { text: 'Drops used', say: 'Pick a day to see\nits drops and cards.' },
      ],
    },
  };

  const shot = SHOTS[params.get('shot') || ''];
  const tile = params.get('tile');

  /** The element a note points at, by selector or by its exact text. @param {Document} d @param {Note} n */
  function target(d, n) {
    if (n.sel) return d.querySelector(n.sel);
    const all = [...d.querySelectorAll('body *')].filter((e) => e.textContent?.trim() === n.text);
    return all[all.length - 1] || null;
  }

  /**
   * Puts each note in the left column at its target's height, below the caption, and draws a line from the note to
   * the target's left edge. Notes that would overlap move down.
   */
  function drawNotes() {
    if (!shot?.notes) return;
    const frame = /** @type {HTMLIFrameElement} */ (document.querySelector('iframe'));
    const d = /** @type {Document} */ (frame.contentDocument);
    const root = /** @type {HTMLElement} */ (document.querySelector('.shot'));
    const minY = /** @type {HTMLElement} */ (document.querySelector('.copy')).getBoundingClientRect().bottom + 24;
    const maxY = 740;
    const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    svg.setAttribute('class', 'leaders');
    svg.setAttribute('width', '1280');
    svg.setAttribute('height', '800');
    root.append(svg);
    let next = minY;
    if (shot.legend) {
      const legend = document.createElement('div');
      legend.className = 'legend';
      legend.innerHTML = '<span class="mask drop"></span><span>A drop is 15 minutes of watching.</span>'
        + '<span class="mask card"></span><span>A card reveals one new video.</span>';
      legend.style.top = `${minY + 8}px`;
      root.append(legend);
      next = minY + 8 + legend.getBoundingClientRect().height + 40;
    }
    // Placed top to bottom by target, so no two leaders cross.
    const placed = shot.notes.map((n) => ({ n, el: target(d, n) })).filter((p) => p.el).map(({ n, el }) => {
      const r = /** @type {Element} */ (el).getBoundingClientRect();
      // A note points at the target's left edge, 12px clear of it, or with top set, at its top edge near the left.
      const tx = PANEL_LEFT + shot.x + (n.top ? r.left + 36 : r.left) * shot.scale - (n.top ? 0 : 12);
      const ty = shot.y + (n.top ? r.top : r.top + r.height / 2) * shot.scale - (n.top ? 8 : 0);
      return { n, tx, ty };
    }).sort((a, b) => a.ty - b.ty);
    for (const { n, tx, ty } of placed) {
      const note = document.createElement('div');
      note.className = 'note';
      note.textContent = n.say;
      root.append(note);
      const h = note.getBoundingClientRect().height;
      const top = Math.min(maxY, Math.max(next, ty - h / 2));
      note.style.top = `${top}px`;
      next = top + h + 22;
      // The line leaves the note's middle, runs level, then bends to the target when the note couldn't sit level with it.
      const ly = top + h / 2;
      const lx = 72 + Math.min(380, measure(note)) + 14;
      const bend = PANEL_LEFT - 24;
      const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      path.setAttribute('d', `M${lx} ${ly} H${bend} L${tx} ${ty}`);
      path.setAttribute('fill', 'none');
      path.setAttribute('stroke', '#1b74c9');
      path.setAttribute('stroke-width', '1.5');
      svg.append(path);
      const dot = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
      dot.setAttribute('cx', String(tx));
      dot.setAttribute('cy', String(ty));
      dot.setAttribute('r', '4');
      dot.setAttribute('fill', '#42a5f6');
      dot.setAttribute('stroke', '#f1ede4');
      dot.setAttribute('stroke-width', '1.5');
      svg.append(dot);
    }
  }

  /** The width of a note's first line of text. @param {HTMLElement} note */
  function measure(note) {
    const range = document.createRange();
    range.selectNodeContents(note);
    const rects = [...range.getClientRects()];
    return rects.length ? Math.max(...rects.filter((q) => Math.abs(q.top - rects[0].top) < 2).map((q) => q.right)) - 72 : 380;
  }

  if (shot) {
    document.body.innerHTML = `
      <div class="shot">
        <div class="copy"><h1></h1><p></p></div>
        <div class="brand"><span class="mask drop"></span>drip</div>
        <div class="panel"><iframe></iframe></div>
      </div>`;
    /** @type {HTMLElement} */ (document.querySelector('h1')).textContent = shot.h;
    /** @type {HTMLElement} */ (document.querySelector('.copy p')).textContent = shot.p;
    const frame = /** @type {HTMLIFrameElement} */ (document.querySelector('iframe'));
    Object.assign(frame.style, {
      width: `${shot.w}px`, height: `${shot.h2}px`, left: `${shot.x}px`, top: `${shot.y}px`, transform: `scale(${shot.scale})`,
    });
    frame.src = shot.src;
    if (shot.bg) /** @type {HTMLElement} */ (document.querySelector('.panel')).style.background = shot.bg;
    // page.html rewrites its own document, so keep checking: put the style in whatever document is there now, and run
    // the step once the page has drawn what this shot needs. The notes go on after the step has settled.
    let stepped = false;
    const poll = setInterval(() => {
      const d = frame.contentDocument;
      if (!d || !d.head) return;
      if (shot.css && !d.getElementById('store-frame-css')) {
        const style = d.createElement('style');
        style.id = 'store-frame-css';
        style.textContent = shot.css;
        d.head.append(style);
      }
      if (!stepped && d.querySelector(shot.ready)) {
        stepped = true;
        shot.step?.(d);
        setTimeout(drawNotes, 1500);
        document.documentElement.dataset.ready = '1';
      }
    }, 100);
    setTimeout(() => clearInterval(poll), 8000);
  } else if (tile) {
    const tiles = {
      // The drop and the wordmark on paper, with the line from screenshot 1 in the headline's serif.
      c: `<div class="tile" style="display:flex;align-items:center;justify-content:center;gap:18px;padding-bottom:6px">
            <span class="mask drop" style="height:104px"></span>
            <div>
              <div class="word" style="font-size:86px;line-height:0.86">drip</div>
              <div style="font-family:Newsreader,Georgia,serif;font-size:31px;margin-top:6px;letter-spacing:-0.4px">One video at a time.</div>
            </div>
          </div>`,
      // Round 8: c larger, with the line on two lines so it stays inside the wordmark's width.
      c2: `<div class="tile" style="display:flex;align-items:center;justify-content:center;gap:22px">
            <span class="mask drop" style="height:128px;margin-top:-14px"></span>
            <div>
              <div class="word" style="font-size:104px;line-height:0.84">drip</div>
              <div style="font-family:Newsreader,Georgia,serif;font-size:30px;line-height:1.05;margin-top:16px;letter-spacing:-0.4px">One video<br>at a time.</div>
            </div>
          </div>`,
      // The drop and the wordmark alone, on paper.
      p: `<div class="tile" style="display:flex;align-items:center;justify-content:center;gap:16px">
            <span class="mask drop" style="height:106px"></span>
            <div class="word" style="font-size:92px;line-height:1">drip</div>
          </div>`,
    };
    document.body.innerHTML = tiles[/** @type {'c'|'c2'|'p'} */ (tile)] || '';
    document.documentElement.dataset.ready = '1';
  }
</script>
</body>
</html>
