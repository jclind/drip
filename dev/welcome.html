<!doctype html>
<meta charset="utf-8">
<title>drip welcome harness</title>
<script>
  // Runs the real welcome page outside the extension, for checking it in a browser. Serve the repo and open
  // http://localhost:8077/dev/welcome.html. Chrome's extension APIs are stubs: messages to the worker are kept in
  // window.__sent and get no state back, so the page shows the defaults (Full drip).
  // ?mode=quiet, curated, or full starts the page as if that mode were saved.
  const listeners = { addListener() {}, removeListener() {} };
  const mode = new URLSearchParams(location.search).get('mode');
  /** @type {any} */ (window).chrome = {
    runtime: {
      id: 'dev',
      getURL: (/** @type {string} */ p) => `/${p}`,
      openOptionsPage() {},
      onMessage: listeners,
      sendMessage(/** @type {any} */ msg) {
        ((/** @type {any} */ (window)).__sent ||= []).push(msg);
        if (msg.type === 'get' && mode) {
          const parts = { quiet: { searchCap: false, cards: 'off', clock: false, stash: false }, curated: { searchCap: true, cards: 'unlimited', clock: false, stash: true } }[mode];
          if (parts) return Promise.resolve({ ok: true, state: { settings: parts } });
        }
        return Promise.resolve({ ok: true });
      },
    },
    storage: { onChanged: listeners, local: { get: async () => ({}) } },
  };
  // document.open keeps this window, and the stubs with it.
  fetch('../src/welcome/welcome.html').then((r) => r.text()).then((html) => {
    document.open();
    document.write(html.replace('<head>', '<head><base href="/src/welcome/">'));
    document.close();
  });
</script>
