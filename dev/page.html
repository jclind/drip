<!doctype html>
<meta charset="utf-8">
<title>drip page harness</title>
<script>
  // In its own scope: the pages' scripts declare top-level names like `state` that these mustn't take first.
  (() => {
  // Runs a real extension page outside the extension, for checking it in a browser. Serve the repo and open
  // http://localhost:8077/dev/page.html?page=welcome (or options, or popup). Chrome's extension APIs are stubs: messages to the
  // worker are kept in window.__sent and answer with a fresh install's state, run through the real rules in state.js.
  // ?mode=quiet, curated, or full starts the page as if that mode were saved. &cards=off, unlimited, or limited, and
  // &clock, &stash, and &searchCap set to 1 or 0, set one part on top of that, for a custom mix.
  // &settled=1 starts it a week after install, so a lighter change waits for the reset (Q6) instead of applying at once.
  const listeners = { addListener() {}, removeListener() {} };
  const params = new URLSearchParams(location.search);
  const mode = params.get('mode');
  const settled = params.get('settled') === '1';
  const page = ['options', 'popup'].includes(params.get('page') || '') ? params.get('page') : 'welcome';
  /** @type {any} */
  let state = null;
  /** @type {any} */ (window).chrome = {
    runtime: {
      id: 'dev',
      getURL: (/** @type {string} */ p) => `/${p}`,
      openOptionsPage() {},
      onMessage: listeners,
      sendMessage(/** @type {any} */ msg) {
        ((/** @type {any} */ (window)).__sent ||= []).push(msg);
        const D = /** @type {any} */ (globalThis).Drip;
        if (!D) return Promise.resolve({ ok: true });
        if (!state) {
          state = D.initialState(settled ? Date.now() - 7 * 86400000 : Date.now());
          if (settled) D.rollDay(state, Date.now());
          if (mode && D.MODES[mode]) Object.assign(state.settings, D.MODES[mode]);
          if (params.has('cards')) state.settings.cards = params.get('cards');
          for (const key of ['clock', 'stash', 'searchCap']) if (params.has(key)) state.settings[key] = params.get(key) === '1';
          // &sample=1 fills two weeks of log and turns on Dry hours, for the store images (store/ART-PLAN.md).
          if (params.get('sample') === '1') {
            state.settings.dryHours = true;
            const minutes = [41, 58, 33, 47, 62, 29, 38, 44, 52, 36, 61, 27, 49, 23];
            minutes.forEach((m, i) => {
              const day = D.addDays(state.day, i - minutes.length + 1);
              state.log[day] = { watchedSec: m * 60, watchSpent: Math.ceil(m / 15), recSpent: 4 + (i % 4), saved: i % 2, watched: 1 + (i % 2), passed: 4 + (i % 4) - (i % 2) - 1 - (i % 2), needThis: [] };
            });
            const at = Date.now() - 3 * 3600000;
            state.log[state.day].needThis.push({ videoId: 'store-bike', title: 'Truing a bike wheel at home, start to finish', reason: 'Fixing my wheel tonight, need the steps', at });
            state.log[D.addDays(state.day, -2)].needThis.push({ videoId: 'store-knife', title: 'Sharpening on a single whetstone', reason: 'Class assignment due Friday', at: at - 2 * 86400000 });
            state.tokens = { watch: 2, rec: 7 };
          }
        }
        const res = msg.type === 'updateSettings' ? D.updateSettings(state, msg.changes, Date.now())
          : msg.type === 'cancelPending' ? D.cancelPending(state, msg.key) : { ok: true };
        return Promise.resolve({ ...res, state: structuredClone(state) });
      },
    },
    storage: { onChanged: listeners, local: { get: async () => ({}) } },
    windows: { getCurrent: async () => ({}) },
    tabs: { query: async () => [] },
  };
  // document.open keeps this window, and the stubs with it.
  fetch(`../src/${page}/${page}.html`).then((r) => r.text()).then((html) => {
    document.open();
    document.write(html.replace('<head>', `<head><base href="/src/${page}/">`));
    document.close();
  });
  })();
</script>
